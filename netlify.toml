[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"

[[redirects]]
  from = "https://alvaradobitservice.com/admin"
  to = "https://admin.alvaradobitservice.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://alvaradobitservice.com/admin/*"
  to = "https://admin.alvaradobitservice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alvaradobitservice.com/admin"
  to = "https://admin.alvaradobitservice.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.alvaradobitservice.com/admin/*"
  to = "https://admin.alvaradobitservice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.alvaradobitservice.com/admin"
  to = "https://admin.alvaradobitservice.com/"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.alvaradobitservice.com/admin/*"
  to = "https://admin.alvaradobitservice.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://admin.alvaradobitservice.com/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[edge_functions]]
  function = "admin-noindex"
  path = "/*"
